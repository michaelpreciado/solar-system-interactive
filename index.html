<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, maximum-scale=5, viewport-fit=cover"
    />
    <meta name="color-scheme" content="dark" />
    <meta name="theme-color" content="#04060a" />

    <title>Orrery — Interactive Solar System</title>
    <meta
      name="description"
      content="Fly through a procedurally rendered solar system. Real orbits from JPL elements, real scale, and every planet's surface generated on your GPU."
    />

    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta
      name="apple-mobile-web-app-status-bar-style"
      content="black-translucent"
    />
    <meta name="apple-mobile-web-app-title" content="Orrery" />
    <meta name="format-detection" content="telephone=no" />

    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/icon-192.png" />

    <meta property="og:type" content="website" />
    <meta property="og:title" content="Orrery — Interactive Solar System" />
    <meta
      property="og:description"
      content="Fly through a procedurally rendered solar system. Real orbits, real scale, real science."
    />
    <meta property="og:image" content="/og-image.svg" />
    <meta name="twitter:card" content="summary_large_image" />

    <style>
      /* Painted before any JS runs, so the first frame is the deep-space
         background rather than a white flash. */
      html,
      body {
        margin: 0;
        background: #04060a;
        color: #e9f2f7;
        font-family:
          -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      }
      #root {
        width: 100%;
        height: 100dvh;
      }
      .boot {
        position: fixed;
        inset: 0;
        display: grid;
        place-items: center;
        background: radial-gradient(
          ellipse at 50% 60%,
          #08121c 0%,
          #04060a 70%
        );
      }
      .boot span {
        width: 34px;
        height: 34px;
        border-radius: 50%;
        border: 2px solid rgba(120, 214, 240, 0.14);
        border-top-color: #5ce1f2;
        animation: boot-spin 0.9s linear infinite;
      }
      @keyframes boot-spin {
        to {
          transform: rotate(360deg);
        }
      }
      @media (prefers-reduced-motion: reduce) {
        .boot span {
          animation: none;
        }
      }
    </style>
  </head>
  <body>
    <div id="root">
      <div class="boot"><span></span></div>
    </div>
    <noscript>
      <p style="padding: 24px">
        Orrery renders the solar system with WebGL and needs JavaScript enabled.
      </p>
    </noscript>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
